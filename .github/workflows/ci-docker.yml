name: ci-docker

on:
  pull_request:
    paths: ["**", "!web/**"]
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: keelwave:ci
          build-args: VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max